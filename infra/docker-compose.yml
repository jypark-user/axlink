name: axlink

services:
  # 표준 데이터 모델 + 임베딩 벡터 저장소
  postgres:
    image: pgvector/pgvector:pg16
    container_name: axlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: axlink
      POSTGRES_PASSWORD: axlink
      POSTGRES_DB: axlink
    # 호스트에 로컬 PostgreSQL 이 5432·5433 을 이미 쓰는 경우가 있어 15432 로 노출한다.
    # 컨테이너 내부는 그대로 5432 다 (flyway·앱이 컨테이너망에서 붙을 때 영향 없음).
    ports: ["15432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axlink -d axlink"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 스키마 마이그레이션. 앱이 파이썬으로 바뀌어도 V1~V19 를 재작성하지 않는다 (ARC-001 6절).
  # 컨테이너로만 돌리므로 앱에 JVM 이 들어가지 않는다.
  flyway:
    image: flyway/flyway:10
    container_name: axlink-flyway
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      -url=jdbc:postgresql://postgres:5432/axlink
      -user=axlink -password=axlink
      -locations=filesystem:/flyway/sql
      -connectRetries=10
      migrate
    volumes:
      - ../db/migration:/flyway/sql:ro

  # 프로젝트 관리 도구 (샘플 원천 + 폐쇄망 온프레미스 서사에 부합)
  redmine-db:
    image: postgres:16
    container_name: axlink-redmine-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: redmine
      POSTGRES_DB: redmine
    volumes:
      - redminedb:/var/lib/postgresql/data

  redmine:
    image: redmine:6
    container_name: axlink-redmine
    restart: unless-stopped
    depends_on: [redmine-db]
    environment:
      REDMINE_DB_POSTGRES: redmine-db
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: redmine
      REDMINE_DB_DATABASE: redmine
      REDMINE_SECRET_KEY_BASE: change-me-in-local-env
    ports: ["3000:3000"]
    volumes:
      - redminefiles:/usr/src/redmine/files

  # 온프레미스 LLM 1단계 (경량 모델 기능구조 선행검증)
  # GPU 전환 시 deploy.resources.reservations.devices 로 교체.
  # 단 09.15 실측: WSL2 컨테이너에 RTX 3070 을 붙이면 bge-m3 러너가 배치 임베딩에서
  # 세그폴트로 죽는다. 임베딩만 쓰는 구성이면 CPU 로 두는 편이 안정적이다.
  ollama:
    image: ollama/ollama:latest
    container_name: axlink-ollama
    restart: unless-stopped
    ports: ["11434:11434"]
    volumes:
      - ollama:/root/.ollama
    profiles: ["llm"]

volumes:
  pgdata:
  redminedb:
  redminefiles:
  ollama:
