# AX Link 개발 환경. 명령 하나로 DB·마이그레이션·Redmine·Ollama·API·웹이 다 뜬다.
#
#   docker compose -f infra/docker-compose.yml up -d --build   일반 실행
#   docker compose -f infra/docker-compose.yml watch            일반 실행 + 고친 소스를 컨테이너로 옮김
#   → http://localhost:5173
#
# Redmine(샘플 원천)은 선택 실행이다: --profile redmine 을 붙일 때만 뜬다.
#
# 프로젝트 이름(axlink)과 볼륨 이름(axlink_pgdata 등)은 바꾸지 않는다. 바꾸면 새 빈 볼륨이 생겨
# 지금까지의 개발 데이터가 안 보인다. 시험 DB 는 별도 프로젝트다(docker-compose.test.yml).
# 이 프로젝트에는 `down` 을 쓰지 않는다. 멈출 때는 `stop` 이다(로컬-실행.md).
name: axlink

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 표준 데이터 모델 + 임베딩 벡터 저장소
  postgres:
    image: pgvector/pgvector:pg16
    container_name: axlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: axlink
      POSTGRES_PASSWORD: axlink
      POSTGRES_DB: axlink
    # 호스트에 로컬 PostgreSQL 이 5432·5433 을 이미 쓰는 경우가 있어 15432 로 노출한다.
    # 컨테이너 내부는 그대로 5432 다 (flyway·앱이 컨테이너망에서 붙을 때 영향 없음).
    ports: ["15432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axlink -d axlink"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  # 스키마 마이그레이션. 앱이 파이썬으로 바뀌어도 V1~V19 를 재작성하지 않는다 (ARC-001 6절).
  # 띄울 때마다 한 번 돌고 끝난다. 이미 최신이면 아무것도 하지 않는다. API 는 이게 성공해야 뜬다.
  # db/migration 은 이미지에 넣는다(운영과 같은 docker/migrate.Dockerfile). Windows 폴더를 붙이면
  # D: 공유가 끊겼을 때 이 단계가 실패해 API 까지 못 뜬다. 새 V 파일은 watch 나 --build 로 반영한다.
  flyway:
    build:
      context: ..
      dockerfile: docker/migrate.Dockerfile
    image: axlink-migrate:dev
    container_name: axlink-flyway
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/axlink
      FLYWAY_USER: axlink
      FLYWAY_PASSWORD: axlink
    develop:
      watch:
        - action: rebuild
          path: ../db/migration
    logging: *logging

  # 프로젝트 관리 도구 (샘플 원천 + 폐쇄망 온프레미스 서사에 부합). 선택 실행이다.
  #   docker compose -f infra/docker-compose.yml --profile redmine up -d redmine-db redmine
  redmine-db:
    image: postgres:16
    container_name: axlink-redmine-db
    profiles: ["redmine"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: redmine
      POSTGRES_DB: redmine
    volumes:
      - redminedb:/var/lib/postgresql/data
    logging: *logging

  redmine:
    image: redmine:6
    container_name: axlink-redmine
    profiles: ["redmine"]
    restart: unless-stopped
    depends_on: [redmine-db]
    environment:
      REDMINE_DB_POSTGRES: redmine-db
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: redmine
      REDMINE_DB_DATABASE: redmine
      REDMINE_SECRET_KEY_BASE: change-me-in-local-env
    ports: ["3000:3000"]
    volumes:
      - redminefiles:/usr/src/redmine/files
    logging: *logging

  # 생성 모델은 Ollama 클라우드 모델(로그인 상태가 볼륨에 있다), 임베딩은 이 안의 bge-m3 다.
  # GPU 전환 시 deploy.resources.reservations.devices 로 교체.
  # 단 09.15 실측: WSL2 컨테이너에 RTX 3070 을 붙이면 bge-m3 러너가 배치 임베딩에서
  # 세그폴트로 죽는다. 임베딩만 쓰는 구성이면 CPU 로 두는 편이 안정적이다.
  ollama:
    image: ollama/ollama:latest
    container_name: axlink-ollama
    restart: unless-stopped
    ports: ["11434:11434"]
    volumes:
      - ollama:/root/.ollama
    logging: *logging

  # API. 소스는 이미지에 들어 있고, `watch` 로 띄우면 고친 app/ 파일이 컨테이너로 옮겨져 다시 뜬다.
  # Windows 폴더를 붙이지 않는다(D: 공유가 끊기면 I/O 오류, 10-01). 업로드 문서는 documents 볼륨이다.
  # 스케줄러가 앱 안에 있어 하나만 띄운다. 호스트에서 uvicorn 을 같이 돌리지 않는다.
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
      target: dev
    image: axlink-api:dev
    container_name: axlink-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    env_file:
      # AXLINK_SECRET_KEY 등 비밀값은 저장소 루트 .env 에서 읽는다(깃에 안 올라간다)
      - path: ../.env
        required: false
    environment:
      # .env 의 호스트용 주소(localhost)를 컨테이너망 주소로 덮는다
      AXLINK_DATABASE_URL: postgresql://axlink:axlink@postgres:5432/axlink
      AXLINK_OLLAMA_BASE_URL: http://ollama:11434
      AXLINK_EMBEDDING_BASE_URL: http://ollama:11434
      AXLINK_CORS_ORIGINS: http://localhost:5173
      AXLINK_ENV: development
      AXLINK_DOCUMENT_ROOT: /data/documents
    volumes:
      # 업로드 문서와 수집한 저장소 파일. 10-01 에 호스트 var/documents 에서 옮겼다(원본은 그대로 남김)
      - documents:/data/documents
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    develop:
      watch:
        # app/ 만 옮긴다. .env·.git·var·tests 는 옮기지 않는다
        - action: sync
          path: ../app
          target: /app/app
          ignore:
            - "**/__pycache__/"
        # 의존성이 바뀌면 이미지를 다시 만든다
        - action: rebuild
          path: ../pyproject.toml
    logging: *logging

  # 웹. Vite 개발 서버. 소스는 이미지에 들어 있고, `docker compose watch` 로 띄우면 고친 파일이
  # 컨테이너로 옮겨져 바로 반영된다. Windows 폴더를 붙여 polling 하지 않는다. 그렇게 했을 때
  # 도커의 D: 공유(9p)가 기동 직후 끊겨 웹·API 가 함께 I/O 오류를 냈다(10-01, 로컬-실행.md).
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      target: dev
    image: axlink-web:dev
    container_name: axlink-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      AXLINK_API_PROXY: http://api:8080
    ports: ["127.0.0.1:5173:5173", "192.168.0.50:5173:5173"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    develop:
      watch:
        # 소스·설정 파일은 옮기기만 한다. vite.config.ts 가 바뀌면 Vite 가 스스로 다시 뜬다
        - action: sync
          path: ../frontend
          target: /web
          ignore:
            - node_modules/
            - dist/
            - "*.tsbuildinfo"
            - package.json
            - package-lock.json
        # 의존성이 바뀌면 이미지를 다시 만든다
        - action: rebuild
          path: ../frontend/package.json
        - action: rebuild
          path: ../frontend/package-lock.json
    logging: *logging

volumes:
  pgdata:
  redminedb:
  redminefiles:
  ollama:
  documents:
