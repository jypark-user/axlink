# 내부 개발·검증 환경 (5174). 모든 변경을 여기 먼저 올린다. 발주기관 공개 환경(5173, 프로젝트 axlink)과
# 웹·API·DB·문서 저장소를 나눈다. 외부 리버스 프록시에 잇지 않는다.
#
#   AXLINK_INT_VERSION=<이미지 태그> docker compose -f infra/docker-compose.int.yml up -d
#   → http://localhost:5174/ax-link/
#
# - DB 와 문서는 이 프로젝트의 영구 볼륨(axlink-int_pgdata·axlink-int_documents)이다. 재시작해도 남는다.
# - 스케줄러(일별 스냅샷·주기 수집)는 끈다. 외부 도구 자동 동기화도 그 안에 있어 같이 꺼진다.
# - 모델 서버(axlink-ollama)는 공개 환경과 같이 쓴다. 문서 처리는 한 번에 하나, 무거운 평가는 따로 시간을 잡는다.
# - 비밀값은 저장소 루트 .env(연결 토큰 키 등)와 .env.int(이 환경의 JWT 키)에서 읽는다. 둘 다 깃에 없다.
# - `down` 은 쓰지 않는다. 볼륨은 `down -v` 가 아니면 남지만, 실수를 막으려고 멈출 때는 `stop` 이다.
#
# 서비스 이름에 int- 를 붙인다. API 가 모델 서버를 쓰려고 공개 환경 네트워크(axlink_default)에 같이 붙는데,
# 이름이 api 면 공개 환경 웹이 이 API 로 요청을 보낼 수 있다.
name: axlink-int

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  int-postgres:
    image: pgvector/pgvector:pg16
    container_name: axlink-int-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: axlink
      POSTGRES_PASSWORD: axlink
      POSTGRES_DB: axlink
    ports: ["127.0.0.1:15474:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axlink -d axlink"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  int-api:
    image: axlink-api:${AXLINK_INT_VERSION:?AXLINK_INT_VERSION 이 필요하다}
    pull_policy: never
    container_name: axlink-int-api
    restart: unless-stopped
    # 문서 볼륨을 공개 환경 사본으로 채우면 파일이 root 소유다(GH-124 와 같은 이유)
    user: "0:0"
    depends_on:
      int-postgres:
        condition: service_healthy
    env_file:
      - path: ../.env
        required: true
      - path: ../.env.int
        required: true
    environment:
      AXLINK_ENV: production
      AXLINK_DATABASE_URL: postgresql://axlink:axlink@int-postgres:5432/axlink
      AXLINK_OLLAMA_BASE_URL: http://ollama:11434
      AXLINK_EMBEDDING_BASE_URL: http://ollama:11434
      AXLINK_DOCUMENT_ROOT: /data/documents
      AXLINK_SCHEDULER_ENABLED: "false"
      AXLINK_DOCUMENT_WORKERS: "1"
      AXLINK_APP_VERSION: ${AXLINK_INT_VERSION}
      AXLINK_BUILD_LABEL: ${AXLINK_INT_VERSION}
      AXLINK_INSTANCE_LABEL: ${AXLINK_INT_LABEL:-내부 개발·검증 환경 (5174)}
      AXLINK_CORS_ORIGINS: http://localhost:5174,http://192.168.0.50:5174
    volumes:
      - documents:/data/documents
    ports: ["127.0.0.1:18174:8080"]
    networks: [default, shared]
    logging: *logging

  int-web:
    image: axlink-web:${AXLINK_INT_VERSION}
    pull_policy: never
    container_name: axlink-int-web
    restart: unless-stopped
    depends_on:
      int-api:
        condition: service_started
    environment:
      AXLINK_API_UPSTREAM: http://int-api:8080
      AXLINK_BASE_PATH: /ax-link/
      # 외부 주소(dev.userinsight.co.kr)는 받지 않는다
      AXLINK_SERVER_NAMES: localhost 127.0.0.1 192.168.0.50
      AXLINK_LOCAL_NAMES: localhost 127.0.0.1 192.168.0.50
    ports:
      - "127.0.0.1:5174:8080"
      - "192.168.0.50:5174:8080"
    logging: *logging

networks:
  # 모델 서버(axlink-ollama)가 있는 공개 환경 네트워크. API 만 붙는다
  shared:
    external: true
    name: axlink_default

volumes:
  pgdata:
  documents:
