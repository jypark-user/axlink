[project]
name = "axlink"
version = "0.1.0"
description = "AX Link — AX 프로젝트 관리 운영 프레임워크"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "psycopg[binary,pool]>=3.2",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "pyjwt>=2.9",
  "bcrypt>=4.2",
  # 문서 추출 (ARC-001 6절 · RSK-010/011 로 검증). Tika(Java) 대체.
  "hwp-hwpx-parser>=1.0",
  "pypdf>=6.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
