[project]
name = "axlink"
version = "0.1.0"
description = "AX Link — AX 프로젝트 관리 운영 프레임워크"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "psycopg[binary,pool]>=3.2",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "pyjwt>=2.9",
  "bcrypt>=4.2",
  "httpx>=0.27",           # 커넥터가 원천 도구 REST 를 호출한다
  "cryptography>=43",      # 인증정보 AES-256-GCM 저장 (SecretCipher 대체)
  "python-multipart>=0.0.9",  # 문서 업로드(multipart/form-data)
  # 문서 추출 (ARC-001 6절 · RSK-010/011 로 검증). Tika(Java) 대체.
  "hwp-hwpx-parser>=1.0",
  "pypdf>=6.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# WBS 는 한 줄이 한 작업인 데이터 표다. 줄을 접으면 오히려 읽기 어렵다.
"scripts/build_wbs.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
