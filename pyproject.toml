[project]
name = "axlink"
version = "0.1.0"
description = "AX Link — AX 프로젝트 관리 운영 프레임워크"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "psycopg[binary,pool]>=3.2",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "pyjwt>=2.9",
  # 5.0.0 은 checkpw 가 맞는 비밀번호를 1% 가량 거부한다(Windows·py3.13 실측).
  # 09.17 재실측: 4.x 도 py3.13 빌드에서는 같은 입력에 다른 해시를 낸다(4.3.0 이 500번 중
  # 80번, 4.2.1 은 1번). py3.9 에서는 0번. 틀린 비밀번호가 통과하지는 않으므로 보안 구멍은
  # 아니고 무작위 로그인 실패로 나타난다. app/auth/service.py 가 거부 시 몇 번 더 확인한다.
  "bcrypt>=4.2,<5",
  "httpx>=0.27",           # 커넥터가 원천 도구 REST 를 호출한다
  "cryptography>=43",      # 인증정보 AES-256-GCM 저장 (SecretCipher 대체)
  "python-multipart>=0.0.9",  # 문서 업로드(multipart/form-data)
  # 문서 추출 (ARC-001 6절 · RSK-010/011 로 검증). Tika(Java) 대체.
  "hwp-hwpx-parser>=1.0",
  "pypdf>=6.0",
  "pdfplumber>=0.11",      # PDF 표. pypdf 는 글자만 뽑고 표를 못 본다
  "python-docx>=1.1",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "error::DeprecationWarning",
  # starlette 가 내부에서 anyio 의 옛 별칭을 쓴다. 우리 코드로는 못 고치고,
  # 이것 때문에 testclient import 부터 죽는다. 우리 코드의 경고만 오류로 본다.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
