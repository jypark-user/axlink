name: Task 작업
description: 구현 · 조사 · 정비 작업 (요구사항 이슈는 이 템플릿을 쓰지 않는다)
title: "[TASK] "
labels: ["유형: 작업"]
body:
  - type: markdown
    attributes:
      value: |
        **요구사항 이슈는 여기서 만들지 않는다.**
        요구사항의 단일 진실 원천은 `docs/10-requirements/IM-001-요구사항정의서.md` 다.
        문서를 먼저 고친다.
  - type: input
    id: reqref
    attributes:
      label: "REQ ID — 관련 요구사항"
      description: 해당 없으면 비워 둔다
      placeholder: SWFR.PIP.010
  - type: dropdown
    id: module
    attributes:
      label: "Module — 모듈"
      options:
        - "CON - 도구 연동·수집"
        - "PIP - 데이터 집계 파이프라인"
        - "WEB - 통합 현황 대시보드"
        - "RAG - 온프레미스 LLM 질의"
        - "DEM - PoC 데모 시스템"
        - "SEC - 보안"
        - "ETC - 문서·인프라·조사"
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: "Detail — 작업 내용"
      description: 왜 필요한지까지 쓴다. 무엇을 했는지는 diff 가 말한다.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: "Done — 완료 조건"
      description: 검증 가능한 형태로. "동작한다" 가 아니라 "무엇을 하면 무엇이 보인다".
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
        커밋 메시지에 대괄호 추적 ID를 반드시 넣는다. 해당 없으면 `[chore]`.
        이슈 참조는 `GH-` / `RM-` 접두를 붙인다. 맨 `#17` 은 금지.
