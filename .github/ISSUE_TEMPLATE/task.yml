name: 개발 작업
description: 구현·조사·문서 작업
title: "[TASK] "
labels: ["type:task"]
body:
  - type: input
    id: reqref
    attributes:
      label: 관련 요구사항
      placeholder: REQ-012
  - type: dropdown
    id: layer
    attributes:
      label: 계층
      options: [connectors, pipeline, ai, templates, web, infra, docs]
    validations: { required: true }
  - type: textarea
    id: detail
    attributes:
      label: 작업 내용
    validations: { required: true }
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
    validations: { required: true }
