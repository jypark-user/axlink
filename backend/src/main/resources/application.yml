server:
  port: 8080

spring:
  application:
    name: ax-link
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/axlink}
    username: ${DB_USERNAME:userinsight-design}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      # 스프링 기본값(파일 1MB)이 axlink.storage.max-upload-bytes 보다 먼저 걸린다 — 같이 올려둔다.
      max-file-size: ${AXLINK_MAX_UPLOAD_SIZE:50MB}
      max-request-size: ${AXLINK_MAX_UPLOAD_SIZE:50MB}

axlink:
  cors:
    allowed-origins: ${AXLINK_CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
  ai:
    adapter: ${AI_ADAPTER:ollama}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      timeout-seconds: 180
      model:
        chat: ${OLLAMA_MODEL_CHAT:qwen3.5:cloud}
        document: ${OLLAMA_MODEL_DOCUMENT:qwen3.5:cloud}
        embedding: ${OLLAMA_MODEL_EMBEDDING:bge-m3}
      embedding-dimension: 1024
  sync:
    poll-interval-ms: ${SYNC_POLL_INTERVAL_MS:3600000}
    backoff-initial-ms: 1000
    backoff-max-ms: 60000
  rag:
    chunk-tokens: 800
    chunk-overlap-ratio: 0.15
    vector-top-k: 40
    fulltext-top-k: 40
    fused-top-k: 8
  storage:
    root: ${AXLINK_STORAGE_ROOT:./axlink-storage}
    max-upload-bytes: ${AXLINK_MAX_UPLOAD_BYTES:52428800}

logging:
  level:
    kr.co.axlink: INFO
